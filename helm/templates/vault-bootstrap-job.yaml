# Vault Bootstrap Job
# Helm hook that initializes and unseals Vault on first deploy

apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "1"
spec:
  template:
    spec:
      serviceAccountName: vault-bootstrap
      containers:
        - name: vault-cli
          image: hashicorp/vault:1.19.1
          imagePullPolicy: IfNotPresent
          env:
            - name: VAULT_ADDR
              value: "http://infra-vault:8200"
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap/vault-bootstrap.sh
              subPath: vault-bootstrap.sh
          command: ["/bootstrap/vault-bootstrap.sh"]
      volumes:
        - name: bootstrap-script
          configMap:
            name: vault-bootstrap-script
            defaultMode: 0755
