# Vault Bootstrap Job
# Helm hook that initializes and unseals Vault on first deploy

apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      ttlSecondsAfterFinished: 100
      restartPolicy: OnFailure
      serviceAccountName: vault-bootstrap
      containers:
        - name: bootstrap
          image: hashicorp/vault:1.19.1
          imagePullPolicy: IfNotPresent
          env:
            - name: VAULT_ADDR
              value: "http://vault-0.vault-internal:8200"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Execute the script content directly
              {{ .Files.Get "files/vault-bootstrap.sh" | nindent 14 }}
      volumes:
        - name: bootstrap-script
          configMap:
            name: vault-bootstrap-script
