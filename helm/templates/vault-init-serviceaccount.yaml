{{- if .Values.vault.initJob.enabled -}}
{{- if .Values.vault.initJob.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.initJob.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.vault.initJob.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.vault.initJob.serviceAccount.annotations | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- if .Values.vault.server.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.server.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}